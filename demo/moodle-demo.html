<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moodle-Demo</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 820px; margin: 0 auto; padding: 16px; background: #f5f5f5; color: #222; }
  section { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 16px 0; }
  iframe { width: 100%; height: 600px; border: 0; border-radius: 8px; display: block; }
</style>
</head>
<body>
<h1>Simulierte Moodle-Lerneinheit</h1>
<p>Jede „Seite" bindet dieselbe <code>index.html</code> mit anderem <code>?level=</code> ein. Alle iframes teilen sich den Spielstand (gleiche Origin).</p>
<section>
  <h2>Seite 1: Lerninhalt …</h2>
  <iframe src="../dist/index.html?level=1" title="Prüfstation Level 1"></iframe>
</section>
<section>
  <h2>Seite 2: Lerninhalt …</h2>
  <iframe src="../dist/index.html?level=2" title="Prüfstation Level 2"></iframe>
</section>
<section>
  <h2>Seite 7: Abschluss</h2>
  <iframe src="../dist/index.html#level=7" title="Prüfstation Finale"></iframe>
</section>
</body>
</html>
