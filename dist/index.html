<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prüfstation</title>
<style>
:root {
  --bg: #1b1f24;
  --panel: #252b32;
  --panel-2: #2e353e;
  --line: #3a434e;
  --text: #e9edf1;
  --muted: #9aa6b2;
  --accent: #f0b232;
  --accent-ink: #1b1f24;
  --ok: #3dbb7d;
  --bad: #e5574f;
  --check: #4aa3f0;
  --radius: 10px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 var(--font);
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
a { color: var(--accent); }
strong { color: #fff; }

#app {
  max-width: 760px;
  margin: 0 auto;
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

/* --- Kopfzeile ------------------------------------------------------------ */
.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  background: #14171b;
  border-bottom: 2px solid var(--line);
  min-height: 46px;
  position: sticky;
  top: 0;
  z-index: 5;
}
.brand { font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 13px; color: var(--muted); }
.brand::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); margin-right: 7px; box-shadow: 0 0 6px var(--ok); vertical-align: 1px; }
.brand.offline::before { background: var(--bad); box-shadow: 0 0 6px var(--bad); }
.lvl { font-size: 13px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--text); }
.score { margin-left: auto; position: relative; font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--accent); }
.score small { font-family: var(--font); font-size: 11px; font-weight: 500; color: var(--muted); margin-right: 6px; text-transform: uppercase; letter-spacing: .05em; }
.plus {
  position: absolute; right: 0; top: -2px;
  font-size: 14px; color: var(--ok); opacity: 0; pointer-events: none;
}
.plus.show { animation: plus 1.1s ease-out; }
@keyframes plus { 0% { opacity: 0; transform: translateY(6px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-18px); } }

.notice { background: #3b2f14; color: #f6dfa6; font-size: 13px; padding: 6px 14px; border-bottom: 1px solid #5b4718; }

/* --- Bildschirm ----------------------------------------------------------- */
.screen { flex: 1; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.center { text-align: center; }
h1, h2, h3 { margin: 0; line-height: 1.25; }
h1 { font-size: 22px; }
h2 { font-size: 18px; }
h3 { font-size: 15px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.btn {
  min-height: 46px; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel-2); cursor: pointer; font-weight: 600;
}
.btn:hover { border-color: var(--muted); }
.btn:focus-visible, .choice:focus-visible, .dec:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; }

/* --- Regel-Intro ---------------------------------------------------------- */
.rule-big { font-size: 20px; line-height: 1.4; font-weight: 500; }
.examples { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.example { display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--panel-2); border-radius: 8px; padding: 8px 10px; }
.example .pair { display: flex; align-items: flex-end; gap: 6px; }
.example .pair .arrow { color: var(--muted); font-size: 18px; padding-bottom: 26px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.chip.FREIGEBEN { background: rgba(61,187,125,.18); color: #7fe0ae; }
.chip.AUSSORTIEREN { background: rgba(229,87,79,.18); color: #ff9a93; }
.chip.NACHPRUEFEN { background: rgba(74,163,240,.18); color: #9cccf6; }
details.known { font-size: 14px; }
details.known summary { cursor: pointer; color: var(--muted); min-height: 32px; display: flex; align-items: center; }
details.known ul { margin: 6px 0 0; padding-left: 20px; }
details.known li { margin: 3px 0; }

/* --- Bauteile ------------------------------------------------------------- */
.part { display: block; }
.part-label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: center; }

/* --- Runde ---------------------------------------------------------------- */
.hud { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.hud .grow { flex: 1; }
.lives { display: inline-flex; gap: 4px; }
.lives i { width: 12px; height: 12px; border-radius: 50%; background: var(--ok); display: inline-block; }
.lives i.lost { background: var(--bad); opacity: .85; }
.timer { height: 6px; background: var(--panel-2); border-radius: 999px; overflow: hidden; }
.timer > span { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left center; }
.timer.hard > span { background: var(--bad); }

/* --- Arbeitsbereich: Regeltafel | Objekt, darunter Entscheidungen ------------ */
.work {
  display: grid; gap: 10px;
  grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
  grid-template-areas: "side stage" "controls controls";
}
.work .belt { grid-area: stage; }
.work .side { grid-area: side; display: flex; }
.work .side .rules { flex: 1; }
.work .controls { grid-area: controls; display: flex; flex-direction: column; gap: 9px; }
@media (min-width: 600px) {
  .work { grid-template-columns: 260px minmax(0, 1fr); grid-template-areas: "side stage" "side controls"; }
}

.belt {
  position: relative; display: flex; align-items: center; justify-content: center;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 14px, transparent 14px 28px),
    var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 8px 10px; min-height: 196px; overflow: hidden;
  transition: box-shadow .2s, border-color .2s;
}
.belt.ok { border-color: var(--ok); box-shadow: 0 0 0 2px var(--ok) inset; }
.belt.bad { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad) inset; }
.belt .prev { position: absolute; top: 6px; left: 6px; opacity: .6; display: flex; flex-direction: column; align-items: center; gap: 0; }
.belt .prev .part-label { font-size: 9px; }
.belt .cur { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 12px; }
.belt .cur.enter { animation: enter .28s ease-out; }
@keyframes enter { from { transform: translateX(60px); opacity: 0; } to { transform: none; opacity: 1; } }
.devbadge { position: absolute; bottom: 4px; right: 6px; font: 10px var(--mono); color: #ff7ad9; background: rgba(0,0,0,.55); padding: 1px 5px; border-radius: 4px; max-width: calc(100% - 12px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.decisions { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); gap: 8px; }
.dec {
  min-height: 58px; border-radius: 9px; border: 2px solid var(--line); background: var(--panel-2);
  cursor: pointer; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  padding: 6px 4px; font-size: 15px;
}
.dec .ico { font-size: 18px; line-height: 1; }
.dec .key { font: 11px var(--mono); color: var(--muted); }
.dec.FREIGEBEN:hover { border-color: var(--ok); }
.dec.AUSSORTIEREN:hover { border-color: var(--bad); }
.dec.NACHPRUEFEN:hover { border-color: var(--check); }
.dec.suggested { border-color: #5aa7ec; box-shadow: 0 0 0 3px rgba(90,167,236,.35); }
.dec[disabled] { opacity: .5; cursor: default; }
/* Bot klickt: Buttons gesperrt, aber nicht ausgegraut; der „gedrückte" Button blitzt auf */
.dec.botlock { pointer-events: none; cursor: default; }
.dec.botpress { animation: botpress .18s ease-out; border-color: var(--ok); background: #2a4a3a; }
@keyframes botpress { from { transform: scale(.94); } to { transform: none; } }

.feedback { min-height: 52px; border-radius: 8px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; font-size: 14px; }
.feedback.ok { background: rgba(61,187,125,.14); color: #8fe6b8; }
.feedback.bad { background: rgba(229,87,79,.14); color: #ffb3ad; }
.feedback.hint { background: #1e3550; color: #cfe6ff; }
.feedback .grow { flex: 1; }
.feedback .btn { min-height: 40px; padding: 6px 14px; }
.keyhint { font-size: 12px; color: var(--muted); text-align: center; }
@media (hover: none) { .keyhint { display: none; } }
.btn.mini { min-height: 34px; padding: 4px 10px; font-size: 13px; border-radius: 999px; }

/* --- Regeltafel: eine Zeile pro Regel -------------------------------------- */
.rules { background: #20262d; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 8px; font-size: 13px; line-height: 1.3; }
.rules-h { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 0 2px 5px; }
.rules-h strong { color: var(--text); }
.rules ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.rules li { display: flex; gap: 7px; align-items: baseline; padding: 4px 6px; border-radius: 6px; border: 1px solid transparent; transition: background .25s, border-color .25s; }
.rules .rid { font: 700 11px var(--mono); color: var(--muted); min-width: 10px; }
.rules li.new { color: #ffe3a3; }
.rules li.new .rid { color: var(--accent); }
.rules li.locked { color: var(--muted); opacity: .45; font-size: 12px; }
/* Aufleuchten nach jeder Entscheidung */
.rules li.hit-ok { background: rgba(61,187,125,.22); border-color: var(--ok); color: #c9f5dc; animation: hit .6s ease-out; }
.rules li.hit-bad { background: rgba(229,87,79,.24); border-color: var(--bad); color: #ffd3cf; animation: hit .6s ease-out; }
.rules li.hit-ok .rid, .rules li.hit-bad .rid { color: inherit; }
@keyframes hit { 0% { transform: scale(1); filter: brightness(1.8); } 40% { transform: scale(1.03); } 100% { transform: none; filter: none; } }
.newtag { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; background: var(--accent); color: var(--accent-ink); padding: 0 5px; border-radius: 999px; vertical-align: 1px; }

/* --- Modusdialog ---------------------------------------------------------- */
.choices { display: grid; gap: 8px; }
.choice {
  text-align: left; background: var(--panel-2); border: 2px solid var(--line); border-radius: 10px;
  padding: 10px 12px; cursor: pointer; display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 4px 10px;
  min-height: 60px;
}
.choice .ico { font-size: 24px; grid-row: span 2; }
.choice .name { font-weight: 700; }
.choice .desc { font-size: 13px; color: var(--muted); grid-column: 2; }
.choice .pts { font: 600 12px var(--mono); color: var(--muted); grid-row: span 2; text-align: right; }
.choice.selected { border-color: var(--accent); background: #3a3320; }
.choice.recommended { border-color: #7a6326; }
.choice.recommended.selected { border-color: var(--accent); }
.choice .reco { grid-column: 2; justify-self: start; font-size: 11px; font-weight: 700; color: var(--accent-ink); background: var(--accent); padding: 1px 7px; border-radius: 999px; }

/* --- Automatisierung ------------------------------------------------------ */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { background: var(--panel-2); border-radius: 8px; padding: 10px 12px; }
.stat .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.stat .v { font: 700 22px var(--mono); }
.stat .v.up::after { content: " ▲"; color: var(--ok); font-size: 14px; }
.upgrade { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border-radius: 8px; padding: 8px 10px; }
.upgrade .grow { flex: 1; }
.upgrade .btn { min-height: 44px; padding: 6px 12px; font-size: 13px; }

/* --- Debriefing ----------------------------------------------------------- */
.result { display: flex; align-items: center; gap: 12px; }
.result .badge { font-size: 28px; }
.reveal { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.big { background: var(--panel-2); border-radius: 10px; padding: 14px 10px; text-align: center; border: 1px solid var(--line); }
.big .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.big .v { font: 800 38px/1.15 var(--mono); }
.big.points .v { color: var(--accent); }
.big.comp { opacity: 0; transform: translateY(10px); transition: opacity .7s ease, transform .7s ease; }
.big.comp.shown { opacity: 1; transform: none; border-color: #4a6f8f; }
.big.comp .v { color: #8ccaff; }
.timeline { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.tl { background: var(--panel-2); border-radius: 8px; padding: 6px 2px; text-align: center; font-size: 12px; }
.tl .ico { font-size: 20px; display: block; }
.tl .n { color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar .top { display: flex; gap: 8px; align-items: baseline; font-size: 14px; }
.bar .id { font: 700 13px var(--mono); color: var(--muted); width: 24px; }
.bar .txt { flex: 1; }
.bar .pct { font: 700 13px var(--mono); }
.bar .track { height: 8px; background: var(--panel-2); border-radius: 999px; overflow: hidden; margin: 4px 0 0 32px; }
.bar .fill { height: 100%; width: 0; background: #6fb8f5; border-radius: 999px; transition: width 1s ease; }
.tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; background: #4a3a19; color: #ffd98a; padding: 1px 7px; border-radius: 999px; }
.firsttime { margin: 4px 0 0 32px; font-size: 13px; background: #2b2a20; border-left: 3px solid var(--accent); padding: 6px 9px; border-radius: 0 6px 6px 0; }
.errlist { display: flex; flex-direction: column; gap: 8px; }
.err { display: flex; gap: 10px; align-items: center; background: var(--panel-2); border-radius: 8px; padding: 6px 8px; font-size: 13px; }
.err .grow { flex: 1; }
ul.q { margin: 0; padding-left: 20px; }
ul.q li { margin: 4px 0; }
.placeholder { font-size: 13px; color: var(--muted); font-style: italic; }

/* --- Übersicht ------------------------------------------------------------ */
.ovlist { display: flex; flex-direction: column; gap: 6px; }
.ov { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border-radius: 8px; padding: 6px 10px; min-height: 48px; }
.ov .grow { flex: 1; }
.ov .st { font-size: 12px; color: var(--muted); }
.ov a.btn { text-decoration: none; display: inline-flex; align-items: center; color: var(--text); }

/* --- Dev ------------------------------------------------------------------ */
.dev { border-top: 2px dashed #8a3c78; background: #1f1520; padding: 10px 16px 16px; font-size: 13px; }
.dev h3 { color: #ff7ad9; }
.dev .row { margin: 6px 0; }
.dev .btn { min-height: 36px; padding: 4px 10px; font-size: 12px; }
.dev a.btn { text-decoration: none; color: var(--text); display: inline-flex; align-items: center; }
.dev pre { font: 11px/1.35 var(--mono); background: #120c13; padding: 8px; border-radius: 6px; max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
.dev table { border-collapse: collapse; font: 12px var(--mono); }
.dev td, .dev th { border: 1px solid #4b2c45; padding: 2px 6px; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 420px) {
  .screen { padding: 10px 12px 14px; }
  .rule-big { font-size: 17px; }
  .dec { font-size: 13px; min-height: 56px; }
  .big .v { font-size: 30px; }
  .belt { min-height: 176px; padding: 10px 6px 8px; }
  .rules li { padding: 3px 5px; }
  .screen { gap: 9px; }
  .feedback { min-height: 46px; padding: 6px 10px; }
  .rules { font-size: 12.5px; }
}

@media (max-height: 680px) {
  .screen { gap: 9px; padding-top: 10px; }
  .belt { min-height: 176px; padding: 10px 8px 8px; }
  .feedback { min-height: 46px; padding: 6px 10px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* --- Navigation ------------------------------------------------------------ */
.navrow { justify-content: center; margin-top: 4px; }
.navrow a.btn { text-decoration: none; color: var(--text); display: inline-flex; align-items: center; }
.navrow a.btn.primary { color: var(--accent-ink); }
.brand.navlink { cursor: pointer; border-radius: 6px; padding: 2px 4px; margin: -2px -4px; }
.brand.navlink:hover { color: var(--text); background: rgba(255,255,255,.06); }
.brand.navlink:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* --- Vorrang sichtbar machen ------------------------------------------------ */
.rules li.overruled > span:not(.rid):not(.overtag) { text-decoration: line-through; text-decoration-thickness: 2px; }
.rules li.overruled { opacity: .55; }
.overtag { margin-left: auto; align-self: center; flex: none; font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em;
  color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 5px; }
.chain { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 3px; font-size: 13px; }
.chain .link { white-space: nowrap; background: rgba(0,0,0,.25); border-radius: 6px; padding: 1px 5px; }
.chain .link:last-child { outline: 1.5px solid currentColor; }
.chain .arr { opacity: .7; }
.example .chain { font-size: 12px; color: var(--muted); justify-content: center; }
.precedence { color: #ffe3a3; }

/* --- Weicher Zeitbonus-Balken mit Beschriftung ------------------------------- */
.timerrow { display: flex; align-items: center; gap: 8px; }
.timerrow .timer { flex: 1; }
.timerrow .tlabel { font-size: 11px; color: var(--muted); white-space: nowrap; }
.feedback .pts { font-weight: 700; margin-left: 6px; }

</style>
</head>
<body>
<!-- Gemeinsame SVG-Muster: Farben zusätzlich per Muster unterscheidbar (Farbsehschwäche) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="pat-red" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
      <rect width="4" height="10" fill="rgba(0,0,0,.28)"></rect>
    </pattern>
    <pattern id="pat-blue" patternUnits="userSpaceOnUse" width="10" height="10">
      <circle cx="5" cy="5" r="1.9" fill="rgba(255,255,255,.38)"></circle>
    </pattern>
    <pattern id="pat-green" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect y="0" width="10" height="3" fill="rgba(0,0,0,.22)"></rect>
    </pattern>
    <pattern id="pat-yellow" patternUnits="userSpaceOnUse" width="12" height="12">
      <path d="M0 6 H12 M6 0 V12" stroke="rgba(0,0,0,.16)" stroke-width="2"></path>
    </pattern>
  </defs>
</svg>
<div id="app">
  <header class="topbar">
    <span class="brand" id="brand"></span>
    <span class="lvl" id="lvl"></span>
    <span class="score" aria-live="polite"><small id="scoreLabel"></small><span id="score">0</span><span class="plus" id="plus"></span></span>
  </header>
  <div id="notice"></div>
  <main class="screen" id="screen"></main>
  <div id="dev"></div>
</div>
<script>
// ===== config.js =====
/*
 * CONFIG – alle Zahlen des Spiels an einer Stelle.
 * Wird im Browser als globales Objekt `DESKILL_CONFIG` bereitgestellt
 * und in Node per `require('./config.js')` geladen (Tests, Simulation).
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.DESKILL_CONFIG = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  return {
    // Speicherschlüssel: <storageKeyPrefix><courseId>. courseId kann per ?course=xyz überschrieben werden.
    storageKeyPrefix: 'deskilling-game:',
    courseId: 'default',

    // Navigations-Buttons („Weiter zu Level n", „Übersicht"). Per URL-Parameter ?nav=0 abschaltbar –
    // empfohlen für Moodle, damit man die Level nicht ohne die Kursseiten durchklickt.
    showNavigation: true,

    // Nach Abschluss dieses Levels wird vor jedem weiteren Level der Modusdialog gezeigt.
    automationOfferAfterLevel: 2,

    // Anteil falscher Vorschläge im Assistenz-Modus.
    assistErrorRate: 0.15,

    // Anzahl korrekter eigener Entscheidungen, ab der eine Regel als „beherrscht" gilt.
    masteryThreshold: 4,

    // Mindestanteil der Objekte eines Levels, bei denen die neue Regel entscheidend ist.
    minNewRuleShare: 0.3,

    // Pro Level: Objektzahl, weiches Zeitbonus-Fenster (Sekunden, null = keins; nur Bonuspunkte, kein Limit –
    // bewusst großzügig, damit man die Regeln in Ruhe verstehen kann),
    // Wahrscheinlichkeit für ⚠ bei Füllobjekten und Gewichte der Zielregeln.
    // „any" = beliebiges Zufallsobjekt (verteiltes Üben, Füllmaterial).
    levels: {

/*
 * rules.js – reine Spiellogik ohne DOM.
 * Browser: globales Objekt `DeskillRules` (config.js muss vorher geladen sein).
 * Node:    const Rules = require('./rules.js')  bzw.  import Rules from '../src/rules.js'

(function (root, factory) {

  else root.DeskillRules = factory(root.DESKILL_CONFIG);
})(typeof globalThis !== 'undefined' ? globalThis : this, function (CONFIG) {
  'use strict';

  const COLORS = ['red', 'blue', 'green', 'yellow'];
  const SHAPES = ['circle', 'square', 'triangle'];
  const NUMBERS = [1, 2, 3, 4, 5, 6, 7, 8, 9];
  const SYMBOLS = ['none', 'warn'];
  const RULE_IDS = ['R1', 'R2', 'R3', 'R4', 'R5', 'R6'];
  const D = { FREIGEBEN: 'FREIGEBEN', AUSSORTIEREN: 'AUSSORTIEREN', NACHPRUEFEN: 'NACHPRUEFEN' };
  const FINALE_LEVEL = 7;
  const FINALE_RULE_LEVEL = 6;

  // R3: „Zahl größer als 5 → Entscheidung umkehren" (ersetzt die ursprüngliche Regel „gerade Zahl",
  // die sich im Test als zu komplex anfühlte). 6–9 sind 4 von 9 Zahlen – gleich häufig wie gerade Zahlen.
  const R3_THRESHOLD = 5;
  const isHigh = (n) => n > R3_THRESHOLD;

  // ---------------------------------------------------------------------------
  // Verbindliche Entscheidungslogik (einzige Quelle der Wahrheit, Briefing 3.3 – R3 angepasst)
  // level = höchste aktive Regelstufe (1–6; Finale = 6), prev = vorheriges Objekt oder null
  // ---------------------------------------------------------------------------
  function decide(obj, prev, level) {
    if (level >= 6 && obj.symbol === 'warn' && obj.shape === 'triangle')
      return { decision: 'FREIGEBEN', rules: ['R6'] };

    if (level >= 5 && prev && prev.color === obj.color && prev.shape === obj.shape)
      return { decision: 'AUSSORTIEREN', rules: ['R5'] };

    if (level >= 4 && obj.symbol === 'warn')
      return { decision: 'NACHPRUEFEN', rules: ['R4'] };

    const rules = [];
    let d = 'FREIGEBEN';
    if (obj.color === 'red') { d = 'AUSSORTIEREN'; rules.push('R1'); }
    if (level >= 2 && obj.shape === 'triangle') { d = 'FREIGEBEN'; rules.push('R2'); }
    if (level >= 3 && isHigh(obj.number)) {
      d = (d === 'FREIGEBEN') ? 'AUSSORTIEREN' : 'FREIGEBEN';
      rules.push('R3');
    }
    if (rules.length === 0) rules.push('R1'); // Standardfall „nicht rot → freigeben"
    return { decision: d, rules };
  }

  // Analyse-Variante: dieselbe Logik, aber jede Regel einzeln schaltbar.
  // decideWith(obj, prev, rulesUpTo(L)) liefert immer dieselbe Entscheidung wie decide(obj, prev, L)
  // (per Test abgesichert). Wird nur benutzt, um zu bestimmen, welche Regel „entscheidend" ist.
  function decideWith(obj, prev, active) {
    const on = (r) => active.has(r);
    if (on('R6') && obj.symbol === 'warn' && obj.shape === 'triangle') return 'FREIGEBEN';
    if (on('R5') && prev && prev.color === obj.color && prev.shape === obj.shape) return 'AUSSORTIEREN';
    if (on('R4') && obj.symbol === 'warn') return 'NACHPRUEFEN';
    let d = 'FREIGEBEN';
    if (on('R1') && obj.color === 'red') d = 'AUSSORTIEREN';
    if (on('R2') && obj.shape === 'triangle') d = 'FREIGEBEN';
    if (on('R3') && isHigh(obj.number)) d = (d === 'FREIGEBEN') ? 'AUSSORTIEREN' : 'FREIGEBEN';
    return d;
  }

  function rulesUpTo(level) {
    return new Set(RULE_IDS.slice(0, Math.max(0, Math.min(level, 6))));
  }

  // Eine Regel ist „entscheidend", wenn das Weglassen genau dieser Regel die Entscheidung ändert.
  function decisiveRules(obj, prev, level) {
    const all = rulesUpTo(level);
    const base = decideWith(obj, prev, all);
    const out = [];
    for (const r of all) {

      without.delete(r);
      if (decideWith(obj, prev, without) !== base) out.push(r);

  // Finale (7) = alle sechs. Freischaltung erfolgt unabhängig vom gewählten Modus.
  function unlockedRules(level) {
    return RULE_IDS.slice(0, Math.max(0, Math.min(level, 6)));
  }

  // Regeln, deren Bedingung am Objekt zutrifft (unabhängig davon, ob sie am Ende entscheidet).
  // Grundlage für das Zeitmodell der Simulation: Jede zutreffende Bedingung muss man prüfen.
  function triggeredRules(obj, prev, level) {

    if (obj.shape === 'triangle') out.push('R2');
    if (isHigh(obj.number)) out.push('R3');
    if (obj.symbol === 'warn') out.push('R4');

  /**
   * Entscheidungskette: wie sich die Entscheidung Regel für Regel entwickelt, wenn man die Regeln
   * in der Reihenfolge ihres Erscheinens hinzunimmt. Aufgeführt wird jede Regel, die zutrifft oder
   * die Entscheidung ändert (R1 immer). Das letzte Glied ist immer die endgültige Entscheidung.
   * Beispiel ⚠ auf rotem Dreieck (Level 6): R1 AUSSORTIEREN → R2 FREIGEBEN → R4 NACHPRUEFEN → R6 FREIGEBEN

  function decisionChain(obj, prev, level) {

    const trig = triggeredRules(obj, prev, max);

    let last = null;
    for (let L = 1; L <= max; L++) {

   * Welche Regeln haben gepasst, wurden aber von einer neueren überstimmt?
   * – alles, was zutrifft, aber nicht in decide().rules steht (R4/R5/R6 schlagen alle älteren)
   * – R1, wenn R2 greift (rotes Dreieck)

  function ruleOutcome(obj, prev, level) {
    const used = decide(obj, prev, level).rules;
    const trig = triggeredRules(obj, prev, level);
    const overruled = trig.filter((r) => !used.includes(r));
    if (used.includes('R1') && used.includes('R2')) overruled.push('R1');
    overruled.sort();
    return { winners: used.filter((r) => !overruled.includes(r)), overruled };

  // ---------------------------------------------------------------------------
  function mulberry32(seed) {

  // Beispiele für die Regel-Intro-Karten (Entscheidung wird per decide() berechnet)
  // ---------------------------------------------------------------------------

  return {

 * Ohne DOM, damit in Node testbar. Browser: globales Objekt `DeskillState`.

          mode: MODES.includes(l.mode) ? l.mode : 'manual',
          points: num(l.points, 0),
          errors: num(l.errors, 0),
          processed: num(l.processed, 0),
          // Bot hat mitten in der Runde übernommen: Anzahl eigener Bauteile davor (sonst null)
          takeoverAt: typeof l.takeoverAt === 'number' && isFinite(l.takeoverAt) ? l.takeoverAt : null

    }
    s.totalPoints = Math.max(0, num(raw.totalPoints, 0));
    if (isObj(raw.competence)) {

    if (Array.isArray(raw.upgrades)) s.upgrades = raw.upgrades.filter((u) => typeof u === 'string');

      '<' + shape + ' fill="' + COLOR_HEX[obj.color] + '"></' + shape.split(' ')[0] + '>' +
      '<' + shape + ' fill="url(#pat-' + obj.color + ')" stroke="rgba(0,0,0,.45)" stroke-width="2.5"></' + shape.split(' ')[0] + '>' +
      '<text x="50" y="' + ty + '" text-anchor="middle" dominant-baseline="central" font-size="' + fs + '" font-weight="800" ' +
      'fill="#fff" stroke="#15181c" stroke-width="4" paint-order="stroke" font-family="system-ui,-apple-system,Segoe UI,sans-serif">' + obj.number + '</text>' +
      warn + '</svg>';
  }
  function partLabel(obj) {
    return '<div class="part-label">' + esc(T.colors[obj.color]) + ' · ' + esc(T.shapes[obj.shape]) + (obj.symbol === 'warn' ? ' · ⚠' : '') + '</div>';
  }
  function partBlock(obj, size) {
    return '<div class="stack" style="gap:3px;align-items:center">' + partSVG(obj, size) + partLabel(obj) + '</div>';
  }

  const DEC_ICON = { FREIGEBEN: '✅', AUSSORTIEREN: '❌', NACHPRUEFEN: '🔍' };
  const chip = (d) => '<span class="chip ' + d + '">' + DEC_ICON[d] + ' ' + esc(T.decisions[d]) + '</span>';

  function hintFor(obj, rules) {
    return rules.map((r) => (r === 'R1' && obj.color !== 'red') ? T.ruleHints.R1_notRed : T.ruleHints[r]).join(' · ');
  }

  // Modus-Anzeige eines Level-Eintrags, inkl. Bot-Übernahme mitten in der Runde
  function modeIcon(l) {
    return T.modeIcons[l.mode] + (l.takeoverAt != null ? '→' + T.modeIcons.auto : '');
  }
  function modeLabel(l) {
    return l.takeoverAt != null
      ? fmt(T.modeWithTakeover, { mode: T.modeNamesShort[l.mode], k: l.takeoverAt + 1 })
      : T.modeNamesShort[l.mode];
  }

  // Ziel „nach Level n": nächstes Level, nach Level 6 das Finale
  const nextAfter = (n) => (n < 6 ? n + 1 : R.FINALE_LEVEL);

  /**
   * Button-Zeile am Ende eines Bildschirms. next = Level-Nummer, 7 (Finale), 'debrief' oder null.
   * Ohne Navigation (Moodle, ?nav=0) bleibt der Hinweis „Weiter mit der nächsten Seite im Kurs".
   */
  function navRow(next, opts) {
    opts = opts || {};
    if (!NAV) return opts.hint === false ? '' : '<p class="center"><strong>' + T.summary.nextPage + '</strong></p>';
    let label = null;
    if (next === 'debrief') label = T.nav.toDebrief;
    else if (next === R.FINALE_LEVEL) label = T.nav.toFinale;
    else if (next != null) label = fmt(T.nav.nextLevel, { n: next });
    return '<div class="row navrow">' +
      (opts.prev ? '<a class="btn" href="' + link(opts.prev) + '">' + fmt(T.nav.prevLevel, { n: opts.prev }) + '</a>' : '') +
      (label ? '<a class="btn primary" id="navNext" href="' + link(next) + '">' + label + '</a>' : '') +
      '<a class="btn" href="' + link(null) + '">' + T.nav.overview + '</a></div>';
  }

  // Enter auf einem Abschluss-Bildschirm → weiter zum nächsten Level (wenn Navigation an)
  function enterToNext() {
    const a = $('#navNext');
    if (a) onEnter(() => { location.href = a.href; });
  }

  function keyToDecision(e, decisions) {
    const map = { '1': 'FREIGEBEN', '2': 'AUSSORTIEREN', '3': 'NACHPRUEFEN', ArrowLeft: 'FREIGEBEN', ArrowRight: 'AUSSORTIEREN', ArrowDown: 'NACHPRUEFEN', ArrowUp: 'NACHPRUEFEN' };
    const d = map[e.key];
    return d && decisions.includes(d) ? d : null;
  }

  function onEnter(fn) {
    keyHandler = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } };
  }

  // ---------------------------------------------------------------------------
  // Routing
  // ---------------------------------------------------------------------------
  function route() {
    const lv = P.level;
    if (lv === 'debrief') return debriefScreen();
    if (lv === String(R.FINALE_LEVEL)) return finaleEntry({});
    if (/^[1-6]$/.test(lv || '')) return levelEntry(Number(lv), {});
    return overview();
  }

  // ---------------------------------------------------------------------------
  // Übersicht (ohne Parameter)
  // ---------------------------------------------------------------------------
  function overview() {
    setHeader(T.overviewLabel);
    const st = load();
    let rows = '';
    for (let n = 1; n <= 6; n++) {
      const l = st.levels[n];
      const status = l && l.done
        ? T.overview.done + ' · ' + modeIcon(l) + ' ' + modeLabel(l) + ' · ' + fmtNum(l.points) + ' ' + T.pointsLabel
        : T.overview.open_;
      rows += '<div class="ov"><strong>' + fmt(T.levelLabel, { n }) + '</strong><span class="grow st">' + esc(status) + '</span>' +
        '<a class="btn" href="' + link(n) + '">' + T.overview.open + '</a></div>';
    }
    const fin = st.finale.attempts ? (st.finale.passed ? '✅ ' : '') + fmt(T.debrief.attempts, { n: st.finale.attempts }) : T.overview.open_;
    rows += '<div class="ov"><strong>' + T.overview.finale + '</strong><span class="grow st">' + esc(fin) + '</span><a class="btn" href="' + link(7) + '">' + T.overview.open + '</a></div>';
    rows += '<div class="ov"><strong>' + T.overview.debrief + '</strong><span class="grow st"></span><a class="btn" href="' + link('debrief') + '">' + T.overview.open + '</a></div>';
    show('<div class="card stack"><h1>' + T.overview.heading + '</h1><p class="muted small">' + T.overview.intro + '</p><div class="ovlist">' + rows + '</div></div>');
  }

  // ---------------------------------------------------------------------------
  // Level-Einstieg
  // ---------------------------------------------------------------------------
  function levelEntry(n, ctx) {
    setHeader(fmt(T.levelLabel, { n }));
    const st = load();
    const rec = st.levels[n];
    if (rec && rec.done && !ctx.force) {
      show('<div class="card stack center"><div class="kicker">' + fmt(T.levelLabel, { n }) + '</div>' +
        '<h2>' + modeIcon(rec) + ' ' + esc(fmt(T.alreadyDone, { points: fmtNum(rec.points), mode: modeLabel(rec) })) + '</h2>' +
        navRow(nextAfter(n)) +
        (DEV ? '<div><button class="btn" id="replay">' + T.replayDev + '</button></div>' : '') + '</div>');
      if (DEV) $('#replay').onclick = () => levelEntry(n, Object.assign({}, ctx, { force: true }));
      enterToNext();
      return;
    }
    const prev = st.levels[n - 1];
    if (n > 1 && !(prev && prev.done) && !ctx.anyway) {
      show('<div class="card stack center"><div class="kicker">' + fmt(T.levelLabel, { n }) + '</div>' +
        '<h2>' + T.previousMissing + '</h2><div><button class="btn" id="anyway">' + T.playAnyway + '</button></div>' +
        navRow(null, { prev: n - 1, hint: false }) + '</div>');
      $('#anyway').onclick = () => levelEntry(n, Object.assign({}, ctx, { anyway: true }));
      waitingForPrevious = true;
      return;
    }
    if (n > CFG.automationOfferAfterLevel) modeDialog(n, (mode) => startLevel(n, mode, ctx));
    else startLevel(n, 'manual', ctx);
  }

  function startLevel(n, mode, ctx) {
    // Vorauswahl im Dialog = zuletzt im Dialog gewählter Modus
    if (n > CFG.automationOfferAfterLevel) update((s) => { s.lastMode = mode; });
    if (mode === 'auto') autoIntro(n);
    else ruleIntro(n, mode, ctx, () => playRound(n, mode, ctx));
  }

  // ---------------------------------------------------------------------------
  // Modusdialog
  // ---------------------------------------------------------------------------
  function modeDialog(n, onChoose) {
    const st = load();
    let sel = st.lastMode;
    const D = T.modeDialog;
    const opts = [
      { id: 'auto', desc: D.autoDesc, pts: D.pointsAuto, reco: true },
      { id: 'assist', desc: D.assistDesc, pts: D.pointsAssist },
      { id: 'manual', desc: D.manualDesc, pts: D.pointsManual }
    ];
    const html = '<div class="card stack"><h2>' + esc(fmt(D.heading, { n })) + '</h2><div class="choices" role="radiogroup">' +
      opts.map((o) => '<button class="choice' + (o.reco ? ' recommended' : '') + (sel === o.id ? ' selected' : '') + '" data-mode="' + o.id + '" role="radio" aria-checked="' + (sel === o.id) + '">' +
        '<span class="ico">' + T.modeIcons[o.id] + '</span><span class="name">' + T.modeNames[o.id] + '</span>' +
        '<span class="pts">' + o.pts + '</span><span class="desc">' + o.desc + '</span>' +
        (o.reco ? '<span class="reco">' + D.recommended + '</span>' : '') + '</button>').join('') +
      '</div><button class="btn primary block" id="go"' + (sel ? '' : ' disabled') + '>' + (sel ? D.start : D.choose) + '</button></div>';
    show(html);
    const go = $('#go');
    $$('.choice').forEach((b) => {
      b.onclick = () => {
        sel = b.dataset.mode;
        $$('.choice').forEach((x) => { x.classList.toggle('selected', x === b); x.setAttribute('aria-checked', String(x === b)); });
        go.disabled = false;
        go.textContent = D.start;
      };
    });
    go.onclick = () => { if (sel) onChoose(sel); };
    onEnter(() => { if (sel) onChoose(sel); });
  }

  // ---------------------------------------------------------------------------
  // Regel-Intro
  // ---------------------------------------------------------------------------
  function ruleIntro(n, mode, ctx, onStart) {
    const rule = 'R' + n;
    const st = update((s) => addSeen(s, [rule]));
    const examples = R.examplesFor(n);
    const exHtml = examples.map((ex) => '<div class="example">' +
      (ex.prev
        ? '<div class="pair"><div class="stack" style="gap:2px;align-items:center;opacity:.6">' + partSVG(ex.prev, 64) + '<div class="part-label">' + T.previousLabel + '</div></div><span class="arrow">→</span>' + partBlock(ex.obj, 90) + '</div>'
        : partBlock(ex.obj, 90)) +
      chip(ex.result.decision) +
      // Ab Level 2: Kette zeigt, wie die neue Regel ältere überschreibt
      (n >= 2 ? chainHtml(ex.obj, ex.prev, n) : '') + '</div>').join('');
    const known = R.unlockedRules(n - 1);
    const knownHtml = known.length
      ? '<details class="known"><summary>' + T.intro.known + ' (' + known.length + ')</summary><ul>' +
        known.map((r) => '<li>' + T.rulesShort[r] + '</li>').join('') + '</ul></details>'
      : '';
    show('<div class="card stack">' +
      '<div class="kicker">' + fmt(ctx.retraining ? T.intro.kickerRetraining : T.intro.kicker, { n }) + '</div>' +
      '<p class="rule-big">' + T.rules[rule] + '</p>' +
      '<div class="examples" aria-label="' + T.intro.examples + '">' + exHtml + '</div>' +
      (n >= 2 ? '<p class="small center precedence">↓ ' + T.intro.precedenceNote + '</p>' : '') +
      knownHtml +
      (mode === 'assist' ? '<p class="small muted">🤝 ' + T.intro.assistNote + '</p>' : '') +
      '<button class="btn primary block" id="go">' + T.intro.start + '</button></div>');
    $('#go').onclick = onStart;
    onEnter(onStart);
  }

  // ---------------------------------------------------------------------------
  // Runde (manuell / Assistenz) – auch für die Umschulung
  // ---------------------------------------------------------------------------
  let devCurrent = null;

  // Regeltafel: eine Zeile pro Regel. Freigeschaltet sind alle Regeln bis `level`
  // (Finale = 7 → alle sechs), spätere erscheinen als gesperrte Zeile.
  function rulePanel(level, highlight) {
    const open = R.unlockedRules(level);
    return '<div class="rules" role="note" aria-label="' + T.rulePanel.heading + '">' +
      '<div class="rules-h"><strong>' + T.rulePanel.heading + '</strong> · ' + T.rulePanel.precedence + '</div><ol>' +
      R.RULE_IDS.map((r) => {
        if (!open.includes(r)) {
          return '<li class="locked" data-r="' + r + '"><span class="rid">' + r.slice(1) + '</span><span>🔒 ' + T.rulePanel.locked + '</span></li>';
        }
        return '<li data-r="' + r + '"' + (r === highlight ? ' class="new"' : '') + '><span class="rid">' + r.slice(1) + '</span><span>' +
          esc(T.rulesCompact[r]) + (r === highlight ? ' <span class="newtag">' + T.rulePanel.newTag + '</span>' : '') + '</span></li>';
      }).join('') +
      '</ol></div>';
  }

  /**
   * Zeigt nach einer Entscheidung auf der Regeltafel, was passiert ist:
   * – die Regeln, die die Entscheidung tragen, leuchten auf (grün = richtig, rot = falsch)
   * – ältere Regeln, die auch gepasst hätten, aber von einer neueren geschlagen wurden: „überstimmt"
   * Ohne Argumente: alles zurücksetzen.
   */
  function showOutcome(item, level, ok) {
    $$('.rules li').forEach((li) => {
      li.classList.remove('hit-ok', 'hit-bad', 'overruled');
      const tag = li.querySelector('.overtag');
      if (tag) tag.remove();
    });
    if (!item) return;
    const out = R.ruleOutcome(item.obj, item.prev, level);
    out.winners.forEach((r) => {
      const li = $('.rules li[data-r="' + r + '"]');
      if (!li) return;
      void li.offsetWidth; // Animation neu starten
      li.classList.add(ok ? 'hit-ok' : 'hit-bad');
    });
    out.overruled.forEach((r) => {
      const li = $('.rules li[data-r="' + r + '"]');
      if (!li || li.classList.contains('locked')) return;
      li.classList.add('overruled');
      li.insertAdjacentHTML('beforeend', '<span class="overtag">' + T.rulePanel.overruled + '</span>');
    });
  }

  // Entscheidungskette als kompakte Zeile: R1 ❌ → R2 ✅ → R3 ❌
  function chainHtml(obj, prev, level) {
    return '<span class="chain">' + R.decisionChain(obj, prev, level).map((s) =>
      '<span class="link"><b>' + s.rule + '</b> ' + DEC_ICON[s.decision] + '</span>').join('<span class="arr">→</span>') + '</span>';
  }

  // Layout: Regeltafel links, Objekt rechts, darunter Entscheidungen + Feedback.
  // Ab ~600 px Breite steht die Regeltafel links neben Objekt UND Entscheidungen.
  function roundFrame(opts) {
    const n = opts.decisions.length;
    return '<div class="hud"><span id="prog"></span><span class="grow"></span>' +
      (opts.takeover ? '<button class="btn mini" id="takeover" title="' + esc(T.round.takeoverTitle) + '">' + T.round.takeover + '</button>' : '') +
      (opts.lives ? '<span id="lives" class="lives" aria-label="' + T.finale.errorsLabel + '"></span>' : '') + '</div>' +
      (opts.timer
        ? (opts.hard
          ? '<div class="timer hard"><span id="bar"></span></div>'
          // weicher Balken: beschriftet, damit klar ist, dass er nur Bonuspunkte gibt
          : '<div class="timerrow"><span class="tlabel">⏱ ' + T.round.timeBonus + '</span><div class="timer"><span id="bar"></span></div></div>')
        : '') +
      '<div class="work">' +
      '<aside class="side">' + rulePanel(opts.level, opts.highlight) + '</aside>' +
      '<div class="belt" id="belt"><div class="prev" id="prevSlot"></div><div class="cur" id="curSlot"></div></div>' +
      '<div class="controls">' +
      '<div class="decisions" style="--n:' + n + '">' + opts.decisions.map((d) =>
        '<button class="dec ' + d + '" data-d="' + d + '"><span class="ico">' + DEC_ICON[d] + '</span>' + T.decisions[d] + '<span class="key">' + T.decisionKeys[d] + '</span></button>').join('') + '</div>' +
      '<div class="feedback" id="fb" aria-live="polite"></div>' +
      '</div></div>' +
      '<div class="keyhint">' + (n === 3 ? T.round.keyHint : T.round.keyHintShort) + (opts.assist ? ' · ' + T.round.keyHintAssist : '') + '</div>';
  }

  // fast = Bot-Modus: keine Einlauf-Animation, Dev-Panel nicht bei jedem Bauteil neu zeichnen.
  function placePart(item, fast) {
    $('#prevSlot').innerHTML = item.prev
      ? partSVG(item.prev, 44) + '<div class="part-label">' + T.previousLabel + '</div>'
      : '';
    const cur = $('#curSlot');
    cur.classList.remove('enter');
    if (!fast) void cur.offsetWidth;
    const compact = window.innerWidth < 600 || window.innerHeight < 680;
    cur.innerHTML = partSVG(item.obj, compact ? 108 : 140) + partLabel(item.obj);
    if (!fast) cur.classList.add('enter');
    const belt = $('#belt');
    belt.classList.remove('ok', 'bad');
    showOutcome(null);
    $$('.devbadge', belt).forEach((e) => e.remove());
    devCurrent = item.correct;
    if (DEV) belt.insertAdjacentHTML('beforeend', '<span class="devbadge">DEV: ' + item.correct.decision + ' (' + item.correct.rules.join(',') + ')</span>');
    if (!fast) renderDev();
  }

  /**
   * Der Bot klickt im normalen Spiel-UI sehr schnell durch `items`.
   * Er entscheidet immer richtig (decide()), die entscheidenden Regeln blitzen grün auf.
   */
  function botPlay(items, level, msPerObject, onEach, onDone) {
    $$('.dec').forEach((b) => { b.disabled = false; b.classList.add('botlock'); b.classList.remove('suggested'); });
    let k = 0;
    const step = () => {
      if (k >= items.length) { renderDev(); onDone(); return; }
      const item = items[k];
      placePart(item, true);
      const d = item.correct.decision;
      const btn = $('.dec[data-d="' + d + '"]');
      if (btn) {
        btn.classList.remove('botpress');
        void btn.offsetWidth;
        btn.classList.add('botpress');
      }
      $('#belt').classList.add('ok');
      if (CFG.feedback.highlightRules) showOutcome(item, level, true);
      k++;
      onEach(k, item);
      later(step, msPerObject);
    };
    step();
  }

  function runTimer(seconds, onTimeout) {
    const bar = $('#bar');
    if (!bar) return { stop() {} };
    const t0 = performance.now();
    let stopped = false;
    const tick = () => {
      if (stopped) return;
      const p = Math.min(1, (performance.now() - t0) / (seconds * 1000));
      bar.style.transform = 'scaleX(' + (1 - p) + ')';
      if (p < 1) frame(tick);
    };
    bar.style.transform = 'scaleX(1)';
    frame(tick);
    const to = onTimeout ? later(() => { if (!stopped) { stopped = true; onTimeout(); } }, seconds * 1000) : null;
    return { stop() { stopped = true; if (to) clearTimeout(to); } };
  }

  function playRound(n, mode, ctx) {
    const seed = R.randomSeed();
    const seq = R.generateLevel(n, seed);
    const lc = CFG.levels[n];
    const decisions = R.availableDecisions(n);
    const rng = R.makeRng(seed ^ 0x9E3779B9);
    const startTotal = load().totalPoints;
    const comp = R.emptyCompetence();
    const seenViaHint = new Set();
    const started = Date.now();
    const canTakeover = !ctx.retraining && n >= CFG.takeoverFromLevel;
    let i = 0, base = 0, streak = 0, errors = 0, locked = true, answered = false, shownAt = 0, suggestion = null, timer = null, pendingNext = null;

    show(roundFrame({ decisions, timer: !!lc.timeBonus, assist: mode === 'assist', level: n, highlight: 'R' + n, takeover: canTakeover }));
    $$('.dec').forEach((b) => { b.onclick = () => choose(b.dataset.d); });
    if (canTakeover) $('#takeover').onclick = takeover;

    function present() {
      const item = seq[i];
      answered = false;
      $('#prog').textContent = fmt(T.round.progress, { i: i + 1, n: seq.length });
      suggestion = mode === 'assist' ? R.botSuggestion(item.correct.decision, n, rng, CFG.assistErrorRate) : null;
      placePart(item, false);
      $$('.dec').forEach((b) => { b.disabled = false; b.classList.toggle('suggested', b.dataset.d === suggestion); });
      const fb = $('#fb');
      fb.className = 'feedback' + (suggestion ? ' hint' : '');
      fb.innerHTML = suggestion ? '<span>🤖 ' + T.round.suggestion + ': <strong>' + T.decisions[suggestion] + '</strong></span>' : '';
      timer = lc.timeBonus ? runTimer(lc.timeBonus, null) : null;
      shownAt = performance.now();
      locked = false;
      keyHandler = (e) => {
        const d = keyToDecision(e, decisions);
        if (d) { e.preventDefault(); choose(d); }
        else if (e.key === 'Enter' && suggestion) { e.preventDefault(); choose(suggestion); }
      };
    }

    function choose(d) {
      if (locked) return;
      locked = true;
      answered = true;
      if (timer) timer.stop();
      const item = seq[i];
      const elapsed = (performance.now() - shownAt) / 1000;
      const correctD = item.correct.decision;
      const ok = d === correctD;
      R.addCompetence(comp, item.correct.rules, R.competenceCredit({ mode, suggestion, decision: d, correctDecision: correctD }));
      $$('.dec').forEach((b) => { b.disabled = true; });
      if (CFG.feedback.highlightRules) showOutcome(item, n, ok);
      const fb = $('#fb');
      if (ok) {
        streak++;
        const pts = R.decisionPoints(elapsed, lc.timeBonus, streak);
        base += pts;
        renderScore(startTotal + R.roundPoints(base, mode));
        $('#belt').classList.add('ok');
        fb.className = 'feedback ok';
        const ptsHtml = '<span class="pts">+' + pts + (streak >= CFG.points.streakFrom ? ' 🔥' + streak : '') + '</span>';
        // Kette zeigen, wenn mehr als eine Regel beteiligt war
        const chain = R.decisionChain(item.obj, item.prev, n);
        const chainPart = chain.length > 1 ? '<br>' + chainHtml(item.obj, item.prev, n) : '';
        if (CFG.feedback.autoAdvanceCorrect) {
          fb.innerHTML = '<div class="grow"><strong>✓ ' + T.round.correct + '</strong> ' + ptsHtml + chainPart + '</div>';
          keyHandler = null;
          pendingNext = later(next, CFG.feedback.correctMs);
        } else {
          // weiter erst per Klick/Enter
          fb.innerHTML = '<div class="grow"><strong>✓ ' + T.round.correct + '</strong> ' + ptsHtml + chainPart + '</div>' +
            '<button class="btn" id="nextBtn">' + T.round.next + '</button>';
          $('#nextBtn').onclick = next;
          $('#nextBtn').focus({ preventScroll: true });
          onEnter(next);
        }
      } else {
        streak = 0;
        errors++;
        item.correct.rules.forEach((r) => seenViaHint.add(r));
        $('#belt').classList.add('bad');
        fb.className = 'feedback bad';
        fb.innerHTML = '<div class="grow"><strong>' + T.round.wrong + '</strong> ' + esc(fmt(T.round.rightWouldBe, { d: T.decisions[correctD] })) +
          '<br>' + chainHtml(item.obj, item.prev, n) + '</div>' +
          '<button class="btn" id="nextBtn">' + T.round.next + '</button>';
        $('#nextBtn').onclick = next;
        $('#nextBtn').focus({ preventScroll: true });
        onEnter(next);
      }
    }

    function next() {
      keyHandler = null;
      pendingNext = null;
      i++;
      if (i >= seq.length) finish(null);
      else present();
    }

    // „Keine Lust mehr": der Bot prüft die restlichen Bauteile dieser Runde.
    function takeover() {
      if (pendingNext) { clearTimeout(pendingNext); pendingNext = null; }
      if (timer) timer.stop();
      locked = true;
      keyHandler = null;
      const from = answered ? i + 1 : i; // aktuelles Bauteil schon beantwortet?
      const rest = seq.slice(from);
      $('#takeover').remove();
      update((s) => { s.lastMode = 'auto'; }); // beim nächsten Modusdialog ist „Automatisieren" vorausgewählt
      const ownTotal = startTotal + R.roundPoints(base, mode);
      const per = R.takeoverPoints(1);
      const fb = $('#fb');
      fb.className = 'feedback ok';
      if (!rest.length) { finish({ at: from, pts: 0 }); return; }
      botPlay(rest, n, CFG.auto.takeoverMsPerObject, (k) => {
        $('#prog').textContent = fmt(T.round.botRunning, { i: from + k, n: seq.length });
        fb.innerHTML = '<strong>🤖 ✓</strong><span class="grow"></span><span>' + fmt(T.round.botPoints, { p: fmtNum(per * k) }) + '</span>';
        renderScore(ownTotal + per * k);
      }, () => finish({ at: from, pts: R.takeoverPoints(rest.length) }));
    }

    function finish(take) {
      const botPts = take ? take.pts : 0;
      const pts = R.roundPoints(base, mode) + botPts;
      const dur = Date.now() - started + (ctx.introMs || 0);
      const st = update((s) => {
        s.totalPoints += pts;
        R.RULE_IDS.forEach((r) => { s.competence[r].correct += comp[r].correct; });
        addSeen(s, Array.from(seenViaHint));
        if (!ctx.retraining) {
          s.levels[n] = { done: true, mode, points: pts, errors, processed: seq.length, takeoverAt: take ? take.at : null };
        }
        if (n >= CFG.automationOfferAfterLevel) s.automationUnlocked = true;
        if (ctx.retraining) {
          s.retraining.activeMs += dur;
          s.retraining.nextLevel = n + 1;
          if (n === 6) s.retraining.finished = Date.now();
        }
      });
      flashPlus(pts);
      roundSummary(n, { pts, errors, mode, total: st.totalPoints, count: take ? take.at : seq.length, take }, ctx);
    }

    present();
  }

  function roundSummary(n, res, ctx) {
    const S_ = T.summary;
    let foot;
    if (ctx.retraining) {
      foot = n < 6
        ? '<button class="btn primary block" id="go">' + fmt(S_.retrainingNext, { n: n + 1 }) + '</button>'
        : '<button class="btn primary block" id="go">' + S_.retrainingDone + '</button>';
    } else {
      foot = navRow(nextAfter(n));
    }
    show('<div class="card stack"><div class="kicker">' + T.modeIcons[res.mode] + ' ' + T.modeNames[res.mode] + (res.take ? ' → 🤖' : '') + '</div>' +
      '<h2>' + fmt(S_.heading, { n }) + '</h2>' +
      '<div class="stats">' +
      '<div class="stat"><div class="k">' + S_.roundPoints + '</div><div class="v">+' + fmtNum(res.pts) + '</div>' + (res.mode === 'assist' ? '<div class="small muted">' + S_.assistBonus + '</div>' : '') + '</div>' +
      '<div class="stat"><div class="k">' + S_.totalPoints + '</div><div class="v">' + fmtNum(res.total) + '</div></div>' +
      '<div class="stat"><div class="k">' + S_.errors + '</div><div class="v">' + res.errors + ' / ' + res.count + '</div></div>' +
      '</div>' +
      (res.take ? '<p class="small muted">' + fmt(S_.takeoverNote, { k: res.take.at + 1, p: fmtNum(res.take.pts) }) + '</p>' : '') +
      foot + '</div>');
    const go = $('#go');
    if (go) {
      const act = n < 6 ? () => retrainingLevel(n + 1) : retrainingDone;
      go.onclick = act;
      onEnter(act);
    } else {
      enterToNext();
    }
  }

      '<p class="rule-big">' + T.rules['R' + n] + '</p>' +
      '<p class="muted">📡 ' + T.intro.autoTransfer + '</p>' +
      '<div class="timer"><span id="xfer" style="transform:scaleX(0)"></span></div>' +

    const tick = () => {
      const p = Math.min(1, (performance.now() - t0) / 700);

  function autoRun(n) {
    const st0 = load();
    const lc = CFG.levels[n];
    const objects = R.autoThroughput(n, st0.upgrades);
    const pts = R.autoPoints(n, objects);
    // Echte Bauteile mit derselben Verteilung wie das Level – der Bot entscheidet per decide().
    const seq = R.generateSequence({
      level: n, count: objects, seed: R.randomSeed(), dist: lc.dist, warnRate: lc.warnRate,
      exact: false, minShares: { ['R' + n]: CFG.minNewRuleShare }
    });
    show(roundFrame({ decisions: R.availableDecisions(n), level: n, highlight: 'R' + n }));
    const fb = $('#fb');
    fb.className = 'feedback ok';
    const per = REDUCED ? Math.max(CFG.auto.minMsPerObject, Math.round(1200 / objects)) : R.botMsPerObject(objects);
    botPlay(seq, n, per, (k) => {
      $('#prog').textContent = fmt(T.round.botRunning, { i: k, n: objects });
      const sofar = Math.round(pts * k / objects);
      fb.innerHTML = '<strong>🤖 ✓ ' + k + '</strong><span class="grow"></span><span>' + fmt(T.round.botPoints, { p: fmtNum(sofar) }) + '</span>';
      renderScore(st0.totalPoints + sofar);
    }, () => {
      update((s) => {
        s.totalPoints += pts;
        s.autoRuns += 1;
        s.levels[n] = { done: true, mode: 'auto', points: pts, errors: 0, processed: objects, takeoverAt: null };
        if (n >= CFG.automationOfferAfterLevel) s.automationUnlocked = true;
      });
      flashPlus(pts);
      later(() => autoResult(n, { objects, pts }), 500);
    });
  }

  function autoResult(n, res) {
    const st = load();
    const eff = R.botEfficiency(st.autoRuns, st.upgrades);
    const ups = CFG.upgrades.map((u) => {
      const owned = st.upgrades.includes(u.id);
      const txt = T.auto.upgrades[u.id] || { name: u.id, desc: '' };
      return '<div class="upgrade"><span style="font-size:20px">⚙️</span><div class="grow"><strong>' + txt.name + '</strong><div class="small muted">' + txt.desc + '</div></div>' +
        (owned ? '<span class="chip FREIGEBEN">✓ ' + T.auto.upgradeBought + '</span>'
          : '<button class="btn" data-up="' + u.id + '"' + (st.totalPoints < u.cost ? ' disabled' : '') + '>' + fmt(T.auto.buy, { cost: fmtNum(u.cost) }) + '</button>') + '</div>';
    }).join('');
    show('<div class="card stack"><div class="kicker">' + fmt(T.levelLabel, { n }) + ' · 🤖 ' + T.modeNames.auto + '</div>' +
      '<h2>' + fmt(T.auto.processed, { n: res.objects }) + ' <span style="color:var(--ok)">+' + fmtNum(res.pts) + ' ' + T.pointsLabel + '</span></h2>' +
      '<div class="stats">' +
      '<div class="stat"><div class="k">' + T.auto.accuracy + '</div><div class="v">100 %</div></div>' +
      '<div class="stat"><div class="k">' + T.auto.points + '</div><div class="v">+' + fmtNum(res.pts) + '</div></div>' +
      '<div class="stat"><div class="k">' + T.auto.total + '</div><div class="v">' + fmtNum(st.totalPoints) + '</div></div>' +
      '<div class="stat"><div class="k">' + T.auto.efficiency + '</div><div class="v' + (st.autoRuns > 1 || st.upgrades.length ? ' up' : '') + '">' + eff + ' %</div></div>' +
      '</div>' +
      '<h3>' + T.auto.upgradesHeading + '</h3><div class="stack" style="gap:6px">' + ups + '</div>' +
      navRow(nextAfter(n)) +
      '</div>');
    enterToNext();
    $$('[data-up]').forEach((b) => {
      b.onclick = () => {
        const u = CFG.upgrades.find((x) => x.id === b.dataset.up);
        let bought = false;
        update((s) => {
          if (!s.upgrades.includes(u.id) && s.totalPoints >= u.cost) { s.totalPoints -= u.cost; s.upgrades.push(u.id); bought = true; }
        });
        if (bought) flashPlus(-u.cost);
        autoResult(n, res);
      };
    });
  }

  function finaleEntry(ctx) {
    setHeader(T.finaleLabel, true);
    const st = load();
    const f = CFG.finale;
    if (st.finale.attempts > 0 && !ctx.again) {
      const last = st.finale.history[st.finale.history.length - 1] || {};
      show('<div class="card stack center"><div class="kicker">' + T.finaleLabel + '</div>' +
        '<h2>' + esc(fmt(T.finale.alreadyDone, { result: last.passed ? T.finale.passed : T.finale.failed, errors: last.errors || 0 })) + '</h2>' +
        '<div class="row" style="justify-content:center"><button class="btn primary" id="deb">' + T.finale.showDebrief + '</button>' +
        (DEV ? '<button class="btn" id="again">' + T.replayDev + '</button>' : '') + '</div>' +
        navRow(null, { hint: false }) + '</div>');
      $('#deb').onclick = debriefScreen;

      return;
    }
    const missing = [1, 2, 3, 4, 5, 6].some((l) => !(st.levels[l] && st.levels[l].done));
    if (missing && !ctx.anyway && !ctx.again) {
      show('<div class="card stack center"><div class="kicker">' + T.finaleLabel + '</div><h2>' + T.previousMissingFinale + '</h2>' +
        '<div><button class="btn" id="anyway">' + T.playAnyway + '</button></div>' +

    show('<div class="card stack center"><div class="kicker" style="color:var(--bad)">⚠ ' + T.finale.offlineBadge + '</div>' +
      '<h1>' + T.finale.heading + '</h1><p class="rule-big">' + T.finale.text + '</p>' +
      '<p class="muted">' + fmt(T.finale.details, { n: f.objects, s: String(f.secondsPerObject).replace('.', ','), e: f.maxErrors }) + '</p>' +
      '<p class="muted small">' + T.finale.rulesShown + '</p>' +
      '<button class="btn primary block" id="go">' + T.finale.start + '</button></div>');

    $('#go').onclick = go;

  function finaleRun(ctx) {
    setHeader(T.finaleLabel, true);
    const f = CFG.finale;
    const seed = R.randomSeed();
    const seq = R.generateFinale(seed);
    const decisions = R.availableDecisions(R.FINALE_RULE_LEVEL);
    const errs = [];
    const times = [];
    const started = Date.now();
    let i = 0, errors = 0, timeouts = 0, locked = true, timer = null, ended = false, shownAt = 0;

    show(roundFrame({ decisions, timer: true, hard: true, lives: true, level: R.FINALE_LEVEL }));
    $$('.dec').forEach((b) => { b.onclick = () => choose(b.dataset.d); });

    function renderLives() {
      $('#lives').innerHTML = '<span class="small" style="margin-right:6px">' + T.finale.errorsLabel + ' ' + errors + '/' + f.maxErrors + '</span>' +
        Array.from({ length: f.maxErrors }, (_, k) => '<i class="' + (k < errors ? 'lost' : '') + '"></i>').join('');
    }

    function present() {
      const item = seq[i];
      $('#prog').textContent = fmt(T.round.progress, { i: i + 1, n: seq.length });
      renderLives();
      placePart(item, '');
      $$('.dec').forEach((b) => { b.disabled = false; });
      $('#fb').className = 'feedback';
      $('#fb').innerHTML = '';
      locked = false;
      shownAt = performance.now();
      timer = runTimer(f.secondsPerObject, () => choose(null));
      keyHandler = (e) => { const d = keyToDecision(e, decisions); if (d) { e.preventDefault(); choose(d); } };
    }

    function choose(d) {
      if (locked) return;
      locked = true;
      keyHandler = null;
      if (timer) timer.stop();
      const item = seq[i];
      const ok = d === item.correct.decision;
      if (d === null) timeouts++;
      else times.push(performance.now() - shownAt);
      $$('.dec').forEach((b) => { b.disabled = true; });
      if (CFG.feedback.highlightRules && CFG.feedback.highlightRulesInFinale) showOutcome(item, R.FINALE_RULE_LEVEL, ok);
      const fb = $('#fb');
      if (ok) {
        $('#belt').classList.add('ok');
        fb.className = 'feedback ok';
        fb.innerHTML = '<strong>✓ ' + T.finale.right + '</strong>';
        later(next, CFG.feedback.finaleCorrectMs);
      } else {
        errors++;
        errs.push({ index: i + 1, obj: item.obj, prev: item.prev, given: d, correct: item.correct.decision, rules: item.correct.rules });
        $('#belt').classList.add('bad');
        fb.className = 'feedback bad';
        fb.innerHTML = '<strong>✗ ' + (d === null ? T.finale.timeout : T.finale.wrong) + '</strong>';
        renderLives();
        if (errors > f.maxErrors) later(() => end(false), CFG.feedback.finaleWrongMs);
        else later(next, CFG.feedback.finaleWrongMs);
      }
    }

    function next() {
      i++;
      if (i >= seq.length) end(true);
      else present();
    }

    function end(passed) {
      if (ended) return;
      ended = true;
      const rec = {
        date: Date.now(), passed, errors, processed: Math.min(i + 1, seq.length), total: seq.length,
        durationMs: Date.now() - started, afterRetraining: !!ctx.afterRetraining, seed, errorsDetail: errs,
        avgReactionMs: times.length ? Math.round(times.reduce((a, b) => a + b, 0) / times.length) : null, timeouts
      };
      update((s) => {
        s.finale.attempts += 1;
        s.finale.passed = s.finale.passed || passed;
        s.finale.history.push(rec);
        if (s.finale.history.length > 10) s.finale.history = s.finale.history.slice(-10);
      });
      show('<div class="card stack center"><h1>' + (passed ? '✅ ' + T.finale.passed : '⛔ ' + T.finale.failed) + '</h1>' +
        '<button class="btn primary block" id="go">' + T.finale.toDebrief + '</button></div>');
      const go = debriefScreen;
      $('#go').onclick = go;
      onEnter(go);
      later(go, 1600);
    }

    present();
  }

  // ---------------------------------------------------------------------------
  // Dev-Modus
  // ---------------------------------------------------------------------------
  function buildProfile(kind) {
    const s = S.defaultState();
    const rng = R.makeRng(4242);
    for (let n = 1; n <= 6; n++) {
      let mode = 'manual';
      if (n > CFG.automationOfferAfterLevel) {
        if (kind === 'assist') mode = 'assist';
        else if (kind === 'auto3') mode = 'auto';
        else if (kind === 'auto5' && n >= 5) mode = 'auto';
      }
      if (mode === 'auto') {
        const objects = R.autoThroughput(n, s.upgrades);
        const pts = R.autoPoints(n, objects);
        s.autoRuns++;
        s.totalPoints += pts;
        s.levels[n] = { done: true, mode, points: pts, errors: 0, processed: objects };
        continue;
      }
      const seq = R.generateLevel(n, 900 + n);
      let base = 0, streak = 0, errors = 0;
      for (const x of seq) {
        const correctD = x.correct.decision;
        const options = R.availableDecisions(n);
        const suggestion = mode === 'assist' ? R.botSuggestion(correctD, n, rng, CFG.assistErrorRate) : null;
        let d;
        if (mode === 'assist') d = suggestion === correctD ? correctD : (rng.chance(0.6) ? correctD : suggestion);
        else d = rng.chance(0.93) ? correctD : rng.pick(options.filter((o) => o !== correctD));
        R.addCompetence(s.competence, x.correct.rules, R.competenceCredit({ mode, suggestion, decision: d, correctDecision: correctD }));
        if (d === correctD) { streak++; base += R.decisionPoints(2, CFG.levels[n].timeBonus, streak); }
        else { streak = 0; errors++; }
      }
      const pts = R.roundPoints(base, mode);
      s.totalPoints += pts;
      s.levels[n] = { done: true, mode, points: pts, errors, processed: seq.length };
      addSeen(s, ['R' + n]);
    }
    s.automationUnlocked = true;
    s.lastMode = s.levels[6].mode;
    return s;
  }

  function renderDev() {
    if (!DEV) return;
    const st = load();
    const sc = R.competenceScores(st.competence);
    const el = $('#dev');
    const lv = [1, 2, 3, 4, 5, 6, 7].map((n) => '<a class="btn" href="' + link(n) + '">' + (n === 7 ? 'Finale' : 'L' + n) + '</a>').join('') +
      '<a class="btn" href="' + link('debrief') + '">Debrief</a><a class="btn" href="' + link(null) + '">Übersicht</a>';
    el.className = 'dev';
    el.innerHTML = '<h3>' + T.dev.heading + '</h3>' +
      '<div class="row">' + lv + '</div>' +
      '<div class="row"><strong>' + T.dev.profiles + ':</strong>' +
      '<button class="btn" data-prof="manual">' + T.dev.profileManual + '</button>' +
      '<button class="btn" data-prof="auto3">' + T.dev.profileAuto + '</button>' +
      '<button class="btn" data-prof="auto5">' + T.dev.profileAuto5 + '</button>' +
      '<button class="btn" data-prof="assist">' + T.dev.profileAssist + '</button>' +
      '<button class="btn" id="devReset" style="border-color:var(--bad)">' + T.dev.reset + '</button></div>' +
      '<div class="row"><strong>' + T.dev.current + ':</strong> <code>' + (devCurrent ? devCurrent.decision + ' (' + devCurrent.rules.join(', ') + ')' : '–') + '</code></div>' +
      '<div class="row"><strong>' + T.dev.competence + ':</strong><table><tr>' + R.RULE_IDS.map((r) => '<th>' + r + '</th>').join('') + '<th>Σ</th></tr><tr>' +
      R.RULE_IDS.map((r) => '<td>' + st.competence[r].correct + ' → ' + Math.round(sc[r] * 100) + '%</td>').join('') + '<td>' + Math.round(sc.total * 100) + '%</td></tr></table></div>' +
      '<div class="small muted">' + T.dev.storageKey + ': <code>' + esc(store.key) + '</code>' + (store.available ? '' : ' (nicht verfügbar)') + '</div>' +
      '<details><summary>' + T.dev.state + '</summary><pre>' + esc(JSON.stringify(st, null, 2)) + '</pre></details>';
    $$('[data-prof]', el).forEach((b) => {
      b.onclick = () => { store.save(buildProfile(b.dataset.prof)); renderScore(load().totalPoints); route(); };
    });
    $('#devReset', el).onclick = () => {
      if (window.confirm(T.dev.resetConfirm)) { store.reset(); renderScore(0); route(); }
    };
  }

  // ---------------------------------------------------------------------------
  // Start
  // ---------------------------------------------------------------------------
  function init() {
    renderScore(load().totalPoints);
    if (!store.available) $('#notice').innerHTML = '<div class="notice">' + T.storageWarning + '</div>';
    window.addEventListener('storage', (e) => {
      if (e.key !== store.key) return;
      renderScore(load().totalPoints);
      renderDev();
      // Vorherige Seite wurde in einem anderen iframe abgeschlossen → Hinweis durch das Level ersetzen
      if (waitingForPrevious) route();
    });
    route();
  }

  init();
})();

</script>
</body>
</html>
